name: Bug report
description: Something in Domino does not behave the way it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time. If this is a security problem, please
        close this and email security@haij.dk instead — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The build stamp from Settings → About, or the commit you are running.
  - type: dropdown
    id: how-run
    attributes:
      label: How are you running Domino?
      options:
        - domino.haij.dk
        - Self-hosted with Docker Compose
        - Local development
    validations:
      required: true
